name: Apex — lot quotidien

# Calcule les pronostics, évalue les matchs terminés et écrit tout dans Supabase.
# Secrets à créer : GitHub › Settings › Secrets and variables › Actions
#   FOOTBALL_DATA_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY, GEMINI_API_KEY (facultatif), API_FOOTBALL_KEY (facultatif), THE_NEWS_API_KEY (facultatif)
on:
  schedule:
    - cron: '0 3 * * *'   # 04:00 à Cotonou : évalue la veille puis calcule aujourd'hui et demain
    - cron: '30 22 * * *' # 23:30 à Cotonou : évalue les matchs du soir
  workflow_dispatch:
    inputs:
      commande:
        description: "demarrage = historique de départ puis lot du jour (à lancer une fois) · batch · evaluer"
        type: choice
        default: demarrage
        options: [demarrage, batch, evaluer]

concurrency:
  group: apex-batch
  cancel-in-progress: false

jobs:
  apex:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      SOURCE: football-data
      STORE: supabase
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      THE_NEWS_API_KEY: ${{ secrets.THE_NEWS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historique de départ (une seule fois)
        if: github.event_name == 'workflow_dispatch' && inputs.commande == 'demarrage'
        run: npm run seed
      - name: Lot du jour (pronostics + évaluation)
        if: github.event_name == 'workflow_dispatch' && (inputs.commande == 'demarrage' || inputs.commande == 'batch') || github.event.schedule == '0 3 * * *'
        run: npm run batch
      - name: Évaluation seule
        if: github.event_name == 'workflow_dispatch' && inputs.commande == 'evaluer' || github.event.schedule == '30 22 * * *'
        run: npm run evaluer
